services:
  # ============================================
  # Base de Datos - PostgreSQL
  # ============================================
  postgres:
    image: postgres:18.1
    container_name: agencia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    command:
    - "postgres"
    - "-c"
    - "shared_buffers=3GB"
    - "-c"
    - "work_mem=16MB"
    - "-c"
    - "maintenance_work_mem=512MB"
    - "-c"
    - "effective_cache_size=7GB"
    - "-c"
    - "max_connections=200"
    - "-c"
    - "statement_timeout=30s"
    - "-c"
    - "idle_in_transaction_session_timeout=60s"
    - "-c"
    - "lock_timeout=5s"
    - "-c"
    - "wal_buffers=16MB"
    - "-c"
    - "checkpoint_timeout=10min"
    - "-c"
    - "max_wal_size=4GB"
    - "-c"
    - "min_wal_size=1GB"
    - "-c"
    - "log_min_duration_statement=500"
    - "-c"
    - "log_lock_waits=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agencia_network


  # ============================================
  # Cache y Memoria de Corto Plazo - Redis
  # ============================================
  redis:
    image: redis:8.4.0-alpine
    container_name: agencia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: America/Bogota
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly yes
      - --appendfsync everysec
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --maxmemory 5gb
      - --maxmemory-policy allkeys-lru
      - --timeout 300
      - --tcp-keepalive 300
      - --protected-mode yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agencia_network
  
  # ============================================
  # Vector Store auxiliar - Redis Vector
  # ============================================
  redis_vector:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: agencia_redis_vector
    restart: unless-stopped
    ports:
      - "6380:6379"
    environment:
      TZ: America/Bogota
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 8gb
      --maxmemory-policy noeviction
    volumes:
      - redis_vector_data:/data
    networks:
      - agencia_network


  # ============================================
  # Cola de Mensajes - RabbitMQ
  # ============================================
  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: agencia_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      TZ: America/Bogota
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - agencia_network


  # ============================================
  # Vector Store Principal - Qdrant
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agencia_qdrant
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agencia_network

#   # ============================================
#   # API FastAPI - AgencIA Backend
#   # ============================================
  agencia_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agencia_api
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    ports:
      - "8000:8000"
      - "5678:5678"
    env_file:
    - .env
    volumes:
      - .:/app
    networks:
      - agencia_network
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    #   rabbitmq:
    #     condition: service_healthy
    #   qdrant:
    #     condition: service_healthy

# ============================================
# Volúmenes Persistentes
# ============================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  redis_vector_data:

# ============================================
# Red de Comunicación
# ============================================
networks:
  agencia_network:
    driver: bridge

